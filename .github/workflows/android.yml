# Android APK: manual builds plus validation of Android playback pull requests.
name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/app/**'
      - 'src/media/**'
      - 'src/ui/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android.yml'

# Avoid redundant APK builds from intermediate commits while iterating on this PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Install Android NDK 27.2.12479018
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: FFmpeg Android Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/xcloud-ps5/ffmpeg-android-arm64-v8a
            ~/.cache/xcloud-ps5/ffmpeg-android-x86_64
          key: android-ffmpeg-${{ hashFiles('.git/modules/deps/ffmpeg/HEAD', 'tools/build-ffmpeg.sh') }}

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nimbox-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
