# Manual build of the Android APK (Actions > Android APK > Run workflow).
name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/nimbox-android-integrated-h264-v1
      - feature/android-surface-third-engine
      - feature/nimbox-horizon-native-v1
      - feature/nimbox-default-ptbr-v1
      - feature/nimbox-ps5-showcase-details-v1
      - feature/nimble-play-internal-brand-v1
      - feature/nimboplay-external-launcher-icons-v1
      - feature/nimboplay-horizon-finite-navigation-v1
    paths:
      - 'android/**'
      - 'assets/branding/**'
      - 'tools/branding/**'
      - 'src/app/**'
      - 'src/media/**'
      - 'src/ui/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android NDK 27.2.12479018
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: FFmpeg Android Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/xcloud-ps5/ffmpeg-android-arm64-v8a
            ~/.cache/xcloud-ps5/ffmpeg-android-x86_64
          key: android-ffmpeg-${{ hashFiles('.git/modules/deps/ffmpeg/HEAD', 'tools/build-ffmpeg.sh') }}

      - name: Build Android Debug APK
        shell: bash
        run: |
          cd android
          for attempt in 1 2 3; do
            set +e
            ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$RUNNER_TEMP/nimbox-gradle.log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 3 ] || ! grep -Eiq 'status code 429|Too Many Requests' "$RUNNER_TEMP/nimbox-gradle.log"; then
              exit "$result"
            fi
            sleep $((attempt * 30))
          done

      - name: Set NimboPlay download filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/NimboPlay-Android-Alpha.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nimboplay-android
          path: android/app/build/outputs/apk/debug/NimboPlay-Android-Alpha.apk
          if-no-files-found: error
