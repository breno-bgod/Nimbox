name: Bug report
description: The app doesn't start, crashes, can't sign in, or a game doesn't stream properly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! The log is the most useful thing you can send:
        it is at `/data/psbox/xcloud.log` on the PS5 (copy it over FTP;
        before v0.9.7 it was at `/data/homebrew/PPSA99810/xcloud.log`).
        Recent versions keep nothing that identifies you in it (no sign-in
        code, gamertag or PS5 user names); still, have a look before posting it.

        **Never attach `account.json`**: it gives access to your Microsoft account.
        For security problems, use the private report link in SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw (error text, black screen, crash, no sound...).
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Platform where you run the application.
      options:
        - PlayStation 4
        - PlayStation 5
        - Linux
        - Windows
        - Android
        - Other
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: App release
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Console firmware (if applicable)
      placeholder: e.g. 4.03
    validations:
      required: false
  - type: input
    id: game
    attributes:
      label: Game(s) affected
      placeholder: e.g. Balatro
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Wired
        - Wi-Fi 5 GHz
        - Wi-Fi 2.4 GHz
        - Other
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Diagnostic logs (optional)
      description: Attach logs if available. Legacy PS5 log path may be /data/psbox/xcloud.log. Do not share account.json or access tokens.
      render: text
    validations:
      required: false
